name: Build Windows exe

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉全历史与 tags：变更说明要 diff 上一 tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装依赖（ascript 的依赖声明会传递解析其余运行时库；pip 缓存随 requirements.txt 哈希自动管理）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Dependency Walker (depends.exe) is available
        shell: pwsh
        run: |
          # 注意：不要用 choco 安装（dependencywalker 包的安装脚本在 runner
          # 上挂起，实测卡 1h57m 于「Performing other installation steps」）；
          # 也不要执行 depends.exe /? 自检（GUI 程序会阻塞 shell）。
          # 顺序：PATH → 常见位置快查 → 官方 x64 zip 下载（稳定快速）。
          $dep = Get-Command depends.exe -ErrorAction SilentlyContinue
          if (-not $dep) {
            $candidatePaths = @(
              "C:\ProgramData\chocolatey\bin",
              "$env:ProgramFiles\Dependency Walker",
              "$env:ProgramFiles(x86)\Dependency Walker",
              "$env:ProgramData\chocolatey\lib\dependencywalker\tools"
            )
            foreach ($p in $candidatePaths) {
              if (Test-Path $p) {
                $found = Get-ChildItem -Path $p -Filter depends.exe -Recurse -ErrorAction SilentlyContinue |
                         Select-Object -First 1
                if ($found) {
                  $dep = $found.FullName
                  break
                }
              }
            }
          }
          if (-not $dep) {
            Write-Host "depends.exe not found locally; downloading official x64 zip..."
            $zipPath = Join-Path $env:RUNNER_TEMP "depends22_x64.zip"
            $extractDir = Join-Path $env:RUNNER_TEMP "DependencyWalker"
            Invoke-WebRequest -Uri "https://www.dependencywalker.com/depends22_x64.zip" -OutFile $zipPath -UseBasicParsing
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $found = Get-ChildItem -Path $extractDir -Filter depends.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) {
              $dep = $found.FullName
            }
          }
          if (-not $dep) {
            Write-Error "depends.exe not found. Nuitka requires Dependency Walker for onefile builds on Windows."
            exit 1
          }
          $depPath = Split-Path $dep
          $env:PATH = "$depPath;$env:PATH"
          # 必须无 BOM：utf8 带 BOM 时 runner 读出的路径被 BOM 字符污染，
          # 下一步骤 PATH 找不到 depends.exe（实测仍触发 Nuitka 重新下载）
          $depPath | Out-File -Encoding utf8NoBOM -Append -FilePath $env:GITHUB_PATH
          Write-Host "Dependency Walker found at: $dep"
          where.exe depends.exe

      - name: Nuitka 构建（onefile、无控制台窗口）
        shell: pwsh
        run: |
          # 双重确认：不在 PATH 时放行，由 Nuitka 的
          # --assume-yes-for-downloads 自动下载兜底
          $dep = Get-Command depends.exe -ErrorAction SilentlyContinue
          if (-not $dep) {
            Write-Host "depends.exe not on PATH; Nuitka will auto-download it."
          } else {
            Write-Host "Using depends.exe: $($dep.Source)"
          }
          python -m nuitka --mode=onefile --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --no-deployment-flag=excluded-module-usage `
            --nofollow-import-to=numpy,onnxruntime `
            --include-package=src `
            --include-module=rapidocr.main `
            --include-package=comtypes `
            --include-package-data=ascript `
            --include-package-data=webview `
            --include-package-data=rapidocr `
            --include-package-data=cv2 `
            --include-package-data=pythonnet `
            --include-package-data=clr_loader `
            --include-package-data=pystray `
            --include-package-data=Crypto `
            --windows-icon-from-ico=res/img/logo.ico `
            --output-filename=zhuomuniao.exe `
            --output-dir=dist_exe `
            main.py

      - name: 组装 pylibs（numpy/onnxruntime 排除出 exe，随包分发）
        shell: pwsh
        run: |
          # --nofollow-import-to 排除的包运行时由 main.py 冻结分支从 pylibs 加载
          # （--no-deployment-flag=excluded-module-usage 关掉 4.3 的 ImportError
          # 守卫后才走正常导入）。复制源码 + 原生 .pyd/.dll（numpy.libs 含
          # OpenBLAS，onnxruntime 自带 onnxruntime.dll），剔除 __pycache__。
          $purelib = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          New-Item -ItemType Directory -Force pylibs | Out-Null
          Copy-Item "$purelib/numpy" pylibs/ -Recurse
          Copy-Item "$purelib/numpy.libs" pylibs/ -Recurse
          Copy-Item "$purelib/onnxruntime" pylibs/ -Recurse
          Get-ChildItem pylibs -Recurse -Directory -Filter __pycache__ |
            Remove-Item -Recurse -Force
          $size = (Get-ChildItem pylibs -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host "pylibs total: $([math]::Round($size/1MB, 1)) MB"

      - name: 收集产物（exe + res + pylibs 同目录打包）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_pkg | Out-Null
          Copy-Item dist_exe/zhuomuniao.exe release_pkg/
          Copy-Item res release_pkg/ -Recurse
          Copy-Item pylibs release_pkg/ -Recurse
          Compress-Archive -Path release_pkg/* -DestinationPath zhuomuniao-windows.zip

      - name: 上传构建产物（Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: zhuomuniao-windows-${{ github.ref_name }}
          path: zhuomuniao-windows.zip

      - name: 生成变更说明（上一 tag 至今的提交列表）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # GitHub 自动生成 notes 只列 PR；本仓库直推无 PR，只会显示
          # 「Full Changelog」对比链接。改为从 git log 生成提交列表
          # 作 release 正文，附完整对比链接。
          $prev = git describe --tags --abbrev=0 HEAD~1 2>$null
          if (-not $prev) {
            $range = "HEAD"
            $link = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          } else {
            $range = "$prev..HEAD"
            $link = "https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$env:GITHUB_REF_NAME"
          }
          $body = "## 变更（$env:GITHUB_REF_NAME）`n"
          $body += (git log --pretty=format:"- %s" $range | Out-String)
          $body += "`n完整对比: $link`n"
          $body | Out-File -Encoding utf8NoBOM -FilePath release_notes.md
          Write-Host "--- 生成的变更说明 ---"
          Write-Host $body

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zhuomuniao-windows.zip
          body_path: release_notes.md