name: Build Windows exe

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

env:
  # 更新清单/更新包的公网根地址。换自定义域名时改仓库 Variable
  # UPDATE_BASE_URL 即可，客户端常量无需改版。
  UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL || 'https://dhxy-ascript.oss-cn-beijing.aliyuncs.com/zhuomuniao/stable' }}
  OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
  OSS_BUCKET: dhxy-ascript
  OSS_PREFIX: zhuomuniao/stable

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉全历史与 tags：变更说明要 diff 上一 tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 打 tag 构建：把 tag 版本号自动烙进 src/__init__.py（面板展示的版本）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 发版免手动改版本号：vX.Y.Z 的 tag 触发构建时，CI 把版本号
          # 写进 src/__init__.py 再打包——exe 里面板显示版本 = tag 版本。
          # 手动 workflow_dispatch 构建不烙（保持代码内开发态版本）。
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          if (-not ($v -match '^\d+\.\d+\.\d+')) {
            Write-Error "tag 版本号格式异常: $env:GITHUB_REF_NAME（应为 vX.Y.Z）"
            exit 1
          }
          $p = "src/__init__.py"
          $content = Get-Content $p -Raw
          $content = $content -replace '__version__\s*=\s*"[^"]*"', ('__version__ = "' + $v + '"')
          Set-Content -Path $p -Value $content -Encoding utf8NoBOM
          Write-Host "版本号已烙为: $v"

      - name: 确定本次构建版本号（tag 用 tag；手动构建用代码版本）
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $m = [regex]::Match((Get-Content "src/__init__.py" -Raw),
                                '__version__\s*=\s*"([^"]+)"')
            if (-not $m.Success) { Write-Error "无法读取 src/__init__.py 版本号"; exit 1 }
            $v = $m.Groups[1].Value
          }
          if (-not ($v -match '^\d+\.\d+\.\d+$')) {
            Write-Error "版本号格式异常: $v"; exit 1
          }
          "APP_VERSION=$v" | Out-File -Encoding utf8NoBOM -Append -FilePath $env:GITHUB_ENV
          Write-Host "APP_VERSION=$v"

      - name: 烙授权应用 ID（生产 23651；本地/未烙默认 24528）
        shell: pwsh
        run: |
          # src/license_app_id.py 仓库内默认为 24528（本地开发用，不消耗生产
          # 卡密）；GitHub 打包前覆写为生产 app 23651，随 exe 烙入分发。
          # 与版本号烙印同模式：仅改 runner 工作副本，不回写仓库。
          $content = 'LICENSE_APP_ID = "23651"' + "`n"
          Set-Content -Path "src/license_app_id.py" -Value $content -Encoding utf8NoBOM
          $baked = (Get-Content "src/license_app_id.py" -Raw).Trim()
          if ($baked -notmatch '23651') { Write-Error "授权 app id 烙入失败: $baked"; exit 1 }
          Write-Host "授权 app id 已烙入: $baked"

      - name: 安装依赖（ascript 的依赖声明会传递解析其余运行时库；pip 缓存随 requirements.txt 哈希自动管理）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Dependency Walker (depends.exe) is available
        shell: pwsh
        run: |
          # 注意：不要用 choco 安装（dependencywalker 包的安装脚本在 runner
          # 上挂起，实测卡 1h57m 于「Performing other installation steps」）；
          # 也不要执行 depends.exe /? 自检（GUI 程序会阻塞 shell）。
          # 顺序：PATH → 常见位置快查 → 官方 x64 zip 下载（稳定快速）。
          $dep = Get-Command depends.exe -ErrorAction SilentlyContinue
          if (-not $dep) {
            $candidatePaths = @(
              "C:\ProgramData\chocolatey\bin",
              "$env:ProgramFiles\Dependency Walker",
              "$env:ProgramFiles(x86)\Dependency Walker",
              "$env:ProgramData\chocolatey\lib\dependencywalker\tools"
            )
            foreach ($p in $candidatePaths) {
              if (Test-Path $p) {
                $found = Get-ChildItem -Path $p -Filter depends.exe -Recurse -ErrorAction SilentlyContinue |
                         Select-Object -First 1
                if ($found) {
                  $dep = $found.FullName
                  break
                }
              }
            }
          }
          if (-not $dep) {
            Write-Host "depends.exe not found locally; downloading official x64 zip..."
            $zipPath = Join-Path $env:RUNNER_TEMP "depends22_x64.zip"
            $extractDir = Join-Path $env:RUNNER_TEMP "DependencyWalker"
            Invoke-WebRequest -Uri "https://www.dependencywalker.com/depends22_x64.zip" -OutFile $zipPath -UseBasicParsing
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $found = Get-ChildItem -Path $extractDir -Filter depends.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) {
              $dep = $found.FullName
            }
          }
          if (-not $dep) {
            Write-Error "depends.exe not found. Nuitka requires Dependency Walker for onefile builds on Windows."
            exit 1
          }
          $depPath = Split-Path $dep
          $env:PATH = "$depPath;$env:PATH"
          # 必须无 BOM：utf8 带 BOM 时 runner 读出的路径被 BOM 字符污染，
          # 下一步骤 PATH 找不到 depends.exe（实测仍触发 Nuitka 重新下载）
          $depPath | Out-File -Encoding utf8NoBOM -Append -FilePath $env:GITHUB_PATH
          Write-Host "Dependency Walker found at: $dep"
          where.exe depends.exe

      - name: Nuitka 构建（onefile、无控制台窗口）
        shell: pwsh
        run: |
          # 双重确认：不在 PATH 时放行，由 Nuitka 的
          # --assume-yes-for-downloads 自动下载兜底
          $dep = Get-Command depends.exe -ErrorAction SilentlyContinue
          if (-not $dep) {
            Write-Host "depends.exe not on PATH; Nuitka will auto-download it."
          } else {
            Write-Host "Using depends.exe: $($dep.Source)"
          }
          python -m nuitka --mode=onefile --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --no-deployment-flag=excluded-module-usage `
            --nofollow-import-to=numpy,onnxruntime `
            --include-package=src `
            --include-module=rapidocr.main `
            --include-package=comtypes `
            --include-package-data=ascript `
            --include-package-data=webview `
            --include-package-data=rapidocr `
            --include-package-data=cv2 `
            --include-package-data=pythonnet `
            --include-package-data=clr_loader `
            --include-package-data=pystray `
            --include-package-data=Crypto `
            --windows-icon-from-ico=res/img/logo.ico `
            --output-filename=zhuomuniao.exe `
            --output-dir=dist_exe `
            main.py

      - name: 组装 pylibs（numpy/onnxruntime 排除出 exe，随包分发）
        shell: pwsh
        run: |
          # --nofollow-import-to 排除的包运行时由 main.py 冻结分支从 pylibs 加载
          # （--no-deployment-flag=excluded-module-usage 关掉 4.3 的 ImportError
          # 守卫后才走正常导入）。复制源码 + 原生 .pyd/.dll（numpy.libs 含
          # OpenBLAS，onnxruntime 自带 onnxruntime.dll），剔除 __pycache__。
          $purelib = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          New-Item -ItemType Directory -Force pylibs | Out-Null
          Copy-Item "$purelib/numpy" pylibs/ -Recurse
          Copy-Item "$purelib/numpy.libs" pylibs/ -Recurse
          Copy-Item "$purelib/onnxruntime" pylibs/ -Recurse
          Get-ChildItem pylibs -Recurse -Directory -Filter __pycache__ |
            Remove-Item -Recurse -Force
          $size = (Get-ChildItem pylibs -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host "pylibs total: $([math]::Round($size/1MB, 1)) MB"

      - name: 组装更新包与完整包（app / pylibs / manual）
        shell: pwsh
        run: |
          # app    = exe + res（每次发版都变，自动更新必下）
          # pylibs = numpy/onnxruntime（内容哈希未变则 OSS 复用旧对象）
          # manual = 完整包（首次安装/救急，不含自动更新清单）
          $v = $env:APP_VERSION
          New-Item -ItemType Directory -Force dist_update | Out-Null
          New-Item -ItemType Directory -Force app_pkg | Out-Null
          New-Item -ItemType Directory -Force pylibs_pkg | Out-Null
          New-Item -ItemType Directory -Force release_pkg | Out-Null

          Copy-Item dist_exe/zhuomuniao.exe app_pkg/
          Copy-Item res app_pkg/ -Recurse
          Copy-Item pylibs pylibs_pkg/ -Recurse
          Copy-Item dist_exe/zhuomuniao.exe release_pkg/
          Copy-Item res release_pkg/ -Recurse
          Copy-Item pylibs release_pkg/ -Recurse

          # 用确定性打包脚本：固定条目顺序/时间戳/权限，保证 pylibs 内容
          # 未变时 zip 字节完全一致，内容寻址（同名对象跳过上传/下载）才生效。
          python scripts/make_zip.py --source app_pkg --output "dist_update/zhuomuniao-app-$v.zip"
          python scripts/make_zip.py --source pylibs_pkg --output "dist_update/zhuomuniao-pylibs.zip"
          python scripts/make_zip.py --source release_pkg --output "dist_update/zhuomuniao-windows-$v.zip"

          Get-ChildItem dist_update | Format-Table Name, Length

      - name: 上传构建产物（Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: zhuomuniao-windows-${{ github.ref_name }}
          path: dist_update/*.zip

      - name: 生成变更说明（上一 tag 至今的提交列表；changelog/<tag>.md 可覆盖）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # GitHub 自动生成 notes 只列 PR；本仓库直推无 PR，只会显示
          # 「Full Changelog」对比链接。改为从 git log 生成提交列表
          # 作 release 正文，附完整对比链接。
          # 若存在 changelog/vX.Y.Z.md，则以其内容为面向用户的更新日志。
          $prev = git describe --tags --abbrev=0 HEAD~1 2>$null
          if (-not $prev) {
            $range = "HEAD"
            $link = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          } else {
            $range = "$prev..HEAD"
            $link = "https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$env:GITHUB_REF_NAME"
          }
          $curated = "changelog/$env:GITHUB_REF_NAME.md"
          if (Test-Path $curated) {
            $body = Get-Content $curated -Raw
            Write-Host "使用人工更新日志: $curated"
            $body += "`n完整对比: $link`n"
          } else {
            $body = "## 变更（$env:GITHUB_REF_NAME）`n"
            $body += (git log --pretty=format:"- %s" $range | Out-String)
            $body += "`n完整对比: $link`n"
          }
          $body | Out-File -Encoding utf8NoBOM -FilePath release_notes.md
          Write-Host "--- 生成的变更说明 ---"
          Write-Host $body

      - name: 生成并校验 update.json（仅打 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          $minSupported = "0.0.0"
          if (Test-Path "release/update_policy.json") {
            $policy = Get-Content "release/update_policy.json" -Raw | ConvertFrom-Json
            if ($policy.min_supported_version) { $minSupported = $policy.min_supported_version }
          }
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          python scripts/make_update_manifest.py generate `
            --version $v `
            --base-url $env:UPDATE_BASE_URL `
            --app-zip "dist_update/zhuomuniao-app-$v.zip" `
            --pylibs-zip "dist_update/zhuomuniao-pylibs.zip" `
            --notes-file release_notes.md `
            --release-url $releaseUrl `
            --min-supported $minSupported `
            --out dist_update/update.json
          python scripts/make_update_manifest.py validate dist_update/update.json `
            --app-zip "dist_update/zhuomuniao-app-$v.zip" `
            --pylibs-zip "dist_update/zhuomuniao-pylibs.zip"

      - name: 上传到阿里云 OSS（仅打 tag；清单最后上传）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if (-not $env:OSS_ACCESS_KEY_ID -or -not $env:OSS_ACCESS_KEY_SECRET) {
            Write-Error "缺少 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（GitHub Secrets）"
            exit 1
          }
          pip install oss2
          $v = $env:APP_VERSION
          python scripts/upload_release.py `
            --endpoint $env:OSS_ENDPOINT `
            --bucket $env:OSS_BUCKET `
            --prefix $env:OSS_PREFIX `
            --manifest dist_update/update.json `
            --app-zip "dist_update/zhuomuniao-app-$v.zip" `
            --pylibs-zip "dist_update/zhuomuniao-pylibs.zip" `
            --manual-zip "dist_update/zhuomuniao-windows-$v.zip"

      - name: 验证公网清单可读（仅打 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 公共读策略未配置时这里会失败：提前暴露，避免用户下载 403。
          $url = $env:UPDATE_BASE_URL.TrimEnd('/') + "/update.json?ts=" + [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          try {
            $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            $data = $r.Content | ConvertFrom-Json
            if ($data.version -ne $env:APP_VERSION) {
              throw "清单版本 $($data.version) 与本次 $env:APP_VERSION 不一致（可能是 CDN 缓存）"
            }
            Write-Host "公网清单验证通过：v$($data.version)"
          } catch {
            Write-Error "更新清单无法公网访问：$url`n请检查 OSS bucket 公共读策略（zhuomuniao/* 允许匿名 GetObject）与对象权限。`n$_"
            exit 1
          }

      - name: 发布到 GitHub Release（仅打 tag，内部留档）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_update/zhuomuniao-windows-*.zip
            dist_update/update.json
          body_path: release_notes.md
