<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        /* 主题变量：深色（默认）/ 浅色（body.light，与主面板主题联动） */
        :root {
            --bg: #1a1a1a;
            --panel: #222;
            --border: #333;
            --text: #ccc;
            --text-dim: #888;
            --accent: #00ff88;
        }
        body.light {
            --bg: #f0f2f5;
            --panel: #ffffff;
            --border: #d9dce1;
            --text: #2c3e50;
            --text-dim: #7f8c8d;
            --accent: #00a86b;
        }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg);
            display: flex; flex-direction: column;
        }
        .log-bar {
            height: 26px; min-height: 26px; flex-shrink: 0;
            display: flex; align-items: center; gap: 10px; padding: 0 10px;
            background: var(--panel); border-bottom: 1px solid var(--border);
            font-size: 12px; font-family: "微软雅黑";
        }
        .log-title { color: var(--accent); }
        .log-hint { color: var(--text-dim); font-size: 11px; margin-left: auto; cursor: pointer; user-select: none; }
        #log-box {
            flex: 1; margin: 0; overflow-y: auto; padding: 4px 10px 8px;
            font-family: 'Consolas', '微软雅黑', monospace; font-size: 11px; line-height: 1.5;
            color: var(--text); white-space: pre-wrap; word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="log-bar">
        <span class="log-title">日 志</span>
        <span class="log-hint" onclick="clearLog()">清 空</span>
    </div>
    <div id="log-box"></div>
    <script>
        // 注意：本页面不声明 callPython（无需桥接，日志仅由 Python 侧 evaluate_js 推送）
        const MAX_LOG_LINES = 500;
        const logBox = document.getElementById('log-box');

        function appendLog(lines) {
            for (const ln of lines) {
                const div = document.createElement('div');
                div.textContent = String(ln);  // textContent 防注入
                logBox.appendChild(div);
            }
            while (logBox.childNodes.length > MAX_LOG_LINES) {
                logBox.removeChild(logBox.firstChild);
            }
            // 始终自动滚动到最新日志
            logBox.scrollTop = logBox.scrollHeight;
        }
        window.addLog = function (line) { appendLog([line]); };
        window.addLogs = function (lines) { if (Array.isArray(lines)) appendLog(lines); };
        function clearLog() { logBox.innerHTML = ''; }
    </script>
</body>
</html>
