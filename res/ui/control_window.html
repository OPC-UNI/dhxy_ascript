<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a1a;
            display: flex; flex-direction: column;
        }
        .header {
            width: 100%; height: 40px; min-height: 40px; flex-shrink: 0;
            display: flex; align-items: center; padding: 0 12px;
            background-color: #222; border-bottom: 1px solid #333;
        }
        .title { color: #eeeeee; font-size: 13px; font-family: "微软雅黑"; font-weight: bold; }
        .body {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
        }
        #status { color: #888; font-size: 12px; font-family: 'Consolas', '微软雅黑', monospace; }
        #status.running { color: #00ff88; }
        .section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .section-title { color: #888; font-size: 12px; font-family: "微软雅黑"; }
        .radio-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px;
            font-size: 13px; font-family: "微软雅黑"; color: #ccc;
        }
        .radio-grid label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        .radio-grid input[type="radio"] { accent-color: #00ff88; cursor: pointer; }
        .switch-row { display: flex; align-items: center; gap: 8px; color: #ccc; font-size: 13px; font-family: "微软雅黑"; cursor: pointer; user-select: none; }
        .switch-row input { display: none; }
        .switch-track {
            width: 40px; height: 20px; border-radius: 10px; background: #444;
            position: relative; transition: background 0.2s;
        }
        .switch-track::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; border-radius: 50%;
            background: #ccc; transition: left 0.2s;
        }
        .switch-row input:checked + .switch-track { background: #00b36b; }
        .switch-row input:checked + .switch-track::after { left: 22px; }
        .threshold-grid { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-family: "微软雅黑"; color: #ccc; }
        .th-row { display: flex; align-items: center; gap: 10px; }
        .th-row .th-label { width: 64px; text-align: right; }
        .th-btn {
            width: 22px; height: 22px; border-radius: 4px; border: 1px solid #444;
            background: #2a2a2a; color: #ccc; font-size: 14px; line-height: 1;
            cursor: pointer; user-select: none;
        }
        .th-btn:hover { background: #3a3a3a; color: #00ff88; }
        .th-val { width: 40px; text-align: center; color: #00ff88; font-family: 'Consolas', monospace; }
        .btn-row { display: flex; gap: 10px; }
        .btn {
            width: 96px; height: 46px; border-radius: 8px; border: 1px solid #444;
            font-size: 16px; font-family: "微软雅黑"; cursor: pointer;
            background: #2a2a2a; color: #eee; transition: all 0.15s;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.25); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        #btn-start { border-color: #00ff88; color: #00ff88; }
        #btn-reset { border-color: #ffb300; color: #ffb300; }
        #btn-close { border-color: #666; color: #999; }
    </style>
</head>
<body>
    <div class="body">
        <div id="status">任务状态：已停止</div>

        <div class="btn-row">
            <button id="btn-start" class="btn" onclick="start()">启 动</button>
            <button id="btn-reset" class="btn" onclick="reset()">重 置</button>
            <button id="btn-close" class="btn" onclick="closeWin()">关 闭</button>
        </div>
        <div class="section">
            <div class="radio-grid" id="mode-grid">
                <label><input type="radio" name="task-mode" value="五环">五环</label>
                <label><input type="radio" name="task-mode" value="客栈">客栈</label>
                <label><input type="radio" name="task-mode" value="修罗">修罗</label>
                <label><input type="radio" name="task-mode" value="五倍">五倍</label>
                <label><input type="radio" name="task-mode" value="玄枢轶闻">玄枢轶闻</label>
                <label><input type="radio" name="task-mode" value="名望">名望</label>
            </div>
        </div>
        <label class="switch-row">
            <input type="checkbox" id="use-syx">
            <span class="switch-track"></span>
            <span>使用摄妖香</span>
        </label>
        <div class="section">
            <div class="section-title">阈值设置（步进5%）</div>
            <div class="threshold-grid">
                <div class="th-row">
                    <span class="th-label">人物红条</span>
                    <button class="th-btn" onclick="th('char_hp', -5)">−</button>
                    <span class="th-val" id="th-char_hp">40%</span>
                    <button class="th-btn" onclick="th('char_hp', 5)">＋</button>
                </div>
                <div class="th-row">
                    <span class="th-label">人物蓝条</span>
                    <button class="th-btn" onclick="th('char_mp', -5)">−</button>
                    <span class="th-val" id="th-char_mp">40%</span>
                    <button class="th-btn" onclick="th('char_mp', 5)">＋</button>
                </div>
                <div class="th-row">
                    <span class="th-label">召唤兽红条</span>
                    <button class="th-btn" onclick="th('beast_hp', -5)">−</button>
                    <span class="th-val" id="th-beast_hp">40%</span>
                    <button class="th-btn" onclick="th('beast_hp', 5)">＋</button>
                </div>
                <div class="th-row">
                    <span class="th-label">召唤兽蓝条</span>
                    <button class="th-btn" onclick="th('beast_mp', -5)">−</button>
                    <span class="th-val" id="th-beast_mp">40%</span>
                    <button class="th-btn" onclick="th('beast_mp', 5)">＋</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let running = false;
        const statusEl = document.getElementById('status');
        const btnStart = document.getElementById('btn-start');
        const modeRadios = document.querySelectorAll('input[name="task-mode"]');
        const useSyx = document.getElementById('use-syx');

        function update() {
            statusEl.innerText = running ? '任务状态：运行中' : '任务状态：已停止';
            statusEl.className = running ? 'running' : '';
            btnStart.disabled = running;  // 运行中必须先重置再启动
        }

        // 页面初始化：恢复上次选择的任务模式、摄妖香开关与各条阈值
        window.addEventListener('onPythonReady', async () => {
            try {
                const info = await callPython('get_init_data');
                if (info && info.mode) {
                    const radio = [...modeRadios].find(el => el.value === info.mode);
                    if (radio) radio.checked = true;
                }
                if (info) {
                    useSyx.checked = !!info.use_sheyaoxiang;
                    const ths = info.thresholds || {};
                    for (const key of ['char_hp', 'char_mp', 'beast_hp', 'beast_mp']) {
                        const el = document.getElementById('th-' + key);
                        if (el && ths[key] !== undefined) el.innerText = ths[key] + '%';
                    }
                }
            } catch (e) {}
        });

        // 阈值步进：±5%，范围 5~95，变更立即保存
        async function th(key, delta) {
            const el = document.getElementById('th-' + key);
            const cur = parseInt(el.innerText);
            const val = Math.min(95, Math.max(5, cur + delta));
            const r = await callPython('save_threshold', key, val);
            if (r && r.status === 'success') el.innerText = r.threshold + '%';
        }

        // 单选变更：立即保存选择
        modeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.checked) callPython('save_task_mode', radio.value);
            });
        });

        // 摄妖香开关变更：立即保存
        useSyx.addEventListener('change', () => {
            callPython('save_use_sheyaoxiang', useSyx.checked);
        });

        // Python 侧（任务状态联动）调用，用于同步页面显示
        window.syncStatus = function (isActive) {
            running = isActive;
            update();
        };

        async function start() {
            if (running) return;
            const r = await callPython('start_task');
            if (r && r.status === 'success') { running = true; update(); }
        }

        async function reset() {
            const r = await callPython('reset_task');
            if (r && r.status === 'success') {
                running = false;
                if (r.mode) {
                    const radio = [...modeRadios].find(el => el.value === r.mode);
                    if (radio) radio.checked = true;
                }
                update();
            }
        }

        function closeWin() {
            callPython('close_window');
        }
    </script>
</body>
</html>
