<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        /* ---- 主题变量：深色（默认）/ 浅色（body.light） ---- */
        :root {
            --bg: #1a1a1a;
            --panel: #222;
            --panel2: #2a2a2a;
            --border: #333;
            --border2: #444;
            --text: #ccc;
            --text-dim: #888;
            --accent: #00ff88;
            --accent-dim: #00b36b;
            --warn: #ffb300;
        }
        body.light {
            --bg: #f0f2f5;
            --panel: #ffffff;
            --panel2: #f7f8fa;
            --border: #d9dce1;
            --border2: #c2c7ce;
            --text: #2c3e50;
            --text-dim: #7f8c8d;
            --accent: #00a86b;
            --accent-dim: #00b36b;
            --warn: #c77700;
        }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg);
            display: flex; flex-direction: column;
        }
        /* ---- 顶部：重置按钮 + 任务状态 + 主题切换 ---- */
        .top-bar {
            height: 48px; min-height: 48px; flex-shrink: 0;
            display: flex; align-items: center; gap: 8px; padding: 0 12px;
            background-color: var(--panel); border-bottom: 1px solid var(--border);
        }
        .btn {
            min-width: 64px; height: 30px; padding: 0 12px; border-radius: 6px;
            border: 1px solid var(--border2); font-size: 13px;
            font-family: "微软雅黑"; cursor: pointer;
            background: var(--panel2); color: var(--text); transition: all 0.15s;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.2); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        #btn-reset { border-color: var(--warn); color: var(--warn); }
        #btn-theme { border-color: var(--accent); color: var(--accent); margin-left: auto; }
        #btn-start { border-color: var(--accent); color: var(--accent); }
        #btn-start.running { border-color: #ff5f5f; color: #ff5f5f; }
        #status { color: var(--text-dim); font-size: 12px; font-family: 'Consolas', '微软雅黑', monospace; }
        #status.running { color: var(--accent); }
        /* ---- Tab 栏 ---- */
        .tab-bar {
            height: 40px; min-height: 40px; flex-shrink: 0;
            display: flex; background-color: var(--panel); border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: 13px; font-family: "微软雅黑";
            cursor: pointer; user-select: none; border-bottom: 2px solid transparent;
            transition: color 0.15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        /* ---- 内容区 ---- */
        .body { flex: 1; overflow-y: auto; }
        .tab-panel {
            display: none; flex-direction: column; align-items: center;
            gap: 12px; padding: 14px 12px; min-height: 100%;
        }
        .tab-panel.active { display: flex; }
        .radio-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px;
            font-size: 13px; font-family: "微软雅黑"; color: var(--text);
        }
        .radio-grid label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        .radio-grid input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
        .radio-grid input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
        /* 战斗设置：5 列小字号，容纳 技能1-1 等标签 */
        .battle-grid { grid-template-columns: repeat(5, 1fr); gap: 6px 4px; font-size: 12px; }
        .switch-row { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; font-family: "微软雅黑"; cursor: pointer; user-select: none; }
        .switch-row input { display: none; }
        .switch-track {
            width: 40px; height: 20px; border-radius: 10px; background: var(--border2);
            position: relative; transition: background 0.2s; flex-shrink: 0;
        }
        .switch-track::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--text-dim); transition: left 0.2s;
        }
        .switch-row input:checked + .switch-track { background: var(--accent-dim); }
        .switch-row input:checked + .switch-track::after { left: 22px; background: #fff; }
        .th-btn {
            width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border2);
            background: var(--panel2); color: var(--text); font-size: 14px; line-height: 1;
            cursor: pointer; user-select: none;
        }
        .th-btn:hover { background: var(--border); color: var(--accent); }
        .th-val { width: 32px; text-align: center; color: var(--accent); font-family: 'Consolas', monospace; }
        /* ---- 任务设置：每任务一组（模式单选 + 次数步进） ---- */
        .task-group {
            width: 100%; display: flex; flex-direction: row; align-items: center;
            gap: 10px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 12px;
        }
        .task-radio {
            flex: 1; display: flex; align-items: center; gap: 6px;
            color: var(--text); font-size: 13px; font-family: "微软雅黑";
            cursor: pointer; user-select: none;
        }
        .task-radio input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
        .task-count { display: flex; align-items: center; gap: 6px; }
        /* ---- 血量蓝量：小卡片式（2 列） ---- */
        .th-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }
        .count-card {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px;
        }
        .cc-name { color: var(--text); font-size: 13px; font-family: "微软雅黑"; }
        .cc-ctrl { display: flex; align-items: center; gap: 6px; }
        /* ---- 分组框（通用/高级设置） ---- */
        .group-box {
            width: 100%; display: flex; flex-direction: column; gap: 10px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px;
        }
        .group-title { color: var(--accent); font-size: 13px; font-family: "微软雅黑"; }
        .group-row { display: flex; align-items: center; gap: 8px; }
        .group-label { color: var(--text); font-size: 13px; font-family: "微软雅黑"; width: 84px; flex-shrink: 0; }
        .group-hint { color: var(--text-dim); font-size: 11px; font-family: "微软雅黑"; }
        .group-sub { color: var(--text-dim); font-size: 12px; font-family: "微软雅黑"; }
        /* 种族选择：独立成行，4 列全宽（12 项 3 行） */
        .race-grid { grid-template-columns: repeat(4, 1fr); width: 100%; }
    </style>
</head>
<body class="light">
    <div class="top-bar">
        <button id="btn-start" class="btn" onclick="toggleTask()">启 动</button>
        <button id="btn-reset" class="btn" onclick="reset()">重 置</button>
        <span id="status">已停止</span>
        <button id="btn-theme" class="btn" onclick="toggleTheme()">深 色</button>
    </div>
    <div class="tab-bar">
        <div class="tab active" data-tab="task">任务设置</div>
        <div class="tab" data-tab="general">通用设置</div>
        <div class="tab" data-tab="advanced">高级设置</div>
    </div>
    <div class="body">
        <!-- 任务设置：每任务一组（模式单选 + 任务次数步进） -->
        <div class="tab-panel active" id="panel-task">
            <div class="task-group">
                <label class="task-radio"><input type="radio" name="task-mode" value="五环"><span>五环</span></label>
                <div class="task-count">
                    <button class="th-btn" onclick="count('五环', -1)">−</button>
                    <span class="th-val" id="cnt-五环">2</span>
                    <button class="th-btn" onclick="count('五环', 1)">＋</button>
                </div>
            </div>
            <div class="task-group">
                <label class="task-radio"><input type="radio" name="task-mode" value="客栈"><span>客栈</span></label>
                <div class="task-count">
                    <button class="th-btn" onclick="count('客栈', -1)">−</button>
                    <span class="th-val" id="cnt-客栈">20</span>
                    <button class="th-btn" onclick="count('客栈', 1)">＋</button>
                </div>
            </div>
            <div class="task-group">
                <label class="task-radio"><input type="radio" name="task-mode" value="修罗"><span>修罗</span></label>
                <div class="task-count">
                    <button class="th-btn" onclick="count('修罗', -1)">−</button>
                    <span class="th-val" id="cnt-修罗">90</span>
                    <button class="th-btn" onclick="count('修罗', 1)">＋</button>
                </div>
            </div>
            <div class="task-group">
                <label class="task-radio"><input type="radio" name="task-mode" value="五倍"><span>五倍</span></label>
                <div class="task-count">
                    <button class="th-btn" onclick="count('五倍', -1)">−</button>
                    <span class="th-val" id="cnt-五倍">100</span>
                    <button class="th-btn" onclick="count('五倍', 1)">＋</button>
                </div>
            </div>
            <div class="task-group">
                <label class="task-radio"><input type="radio" name="task-mode" value="玄枢轶闻"><span>玄枢轶闻</span></label>
                <div class="task-count">
                    <button class="th-btn" onclick="count('玄枢轶闻', -1)">−</button>
                    <span class="th-val" id="cnt-玄枢轶闻">5</span>
                    <button class="th-btn" onclick="count('玄枢轶闻', 1)">＋</button>
                </div>
            </div>
            <div class="task-group">
                <label class="task-radio"><input type="radio" name="task-mode" value="名望"><span>名望</span></label>
                <div class="task-count">
                    <button class="th-btn" onclick="count('名望', -1)">−</button>
                    <span class="th-val" id="cnt-名望">5</span>
                    <button class="th-btn" onclick="count('名望', 1)">＋</button>
                </div>
            </div>
        </div>
        <!-- 通用设置：摄妖香开关 + 修罗/五倍分组 + 血量蓝量阈值 + 人物/召唤兽战斗动作 -->
        <div class="tab-panel" id="panel-general">
            <!-- 摄妖香分组 -->
            <div class="group-box">
                <div class="group-title">摄妖香</div>
                <label class="switch-row">
                    <input type="checkbox" id="use-syx">
                    <span class="switch-track"></span>
                    <span>自动使用</span>
                </label>
            </div>
            <!-- 修罗设置分组：最少人数 + 必须有的种族（仅队长时生效） -->
            <div class="group-box">
                <div class="group-title">修罗设置（仅队长时生效）</div>
                <div class="group-row">
                    <span class="group-label">最少人数</span>
                    <button class="th-btn" onclick="xiuluoMin(-1)">−</button>
                    <span class="th-val" id="xiuluo-min">5</span>
                    <button class="th-btn" onclick="xiuluoMin(1)">＋</button>
                    <span class="group-hint">范围 3~5</span>
                </div>
                <div class="group-sub">必须有的种族</div>
                <div class="radio-grid race-grid" id="xiuluo-race-grid"></div>
                <label class="switch-row">
                    <input type="checkbox" id="xiuluo-hezi">
                    <span class="switch-track"></span>
                    <span>自动抢盒子（仅非队长时生效，队长一定抢）</span>
                </label>
            </div>
            <!-- 五倍设置分组：最少人数（仅队长时生效）+ 自动抢盒子（仅非队长时生效） -->
            <div class="group-box">
                <div class="group-title">五倍设置</div>
                <div class="group-row">
                    <span class="group-label">最少人数</span>
                    <button class="th-btn" onclick="wubeiMin(-1)">−</button>
                    <span class="th-val" id="wubei-min">5</span>
                    <button class="th-btn" onclick="wubeiMin(1)">＋</button>
                    <span class="group-hint">范围 1~5（仅队长时生效）</span>
                </div>
                <label class="switch-row">
                    <input type="checkbox" id="wubei-hezi">
                    <span class="switch-track"></span>
                    <span>自动抢盒子（仅非队长时生效，队长一定抢）</span>
                </label>
            </div>
            <!-- 血量蓝量分组 -->
            <div class="group-box">
                <div class="group-title">血量蓝量设置（步进5%）</div>
                <div class="th-grid">
                    <div class="count-card">
                        <div class="cc-name">人物红条</div>
                        <div class="cc-ctrl">
                            <button class="th-btn" onclick="th('char_hp', -5)">−</button>
                            <span class="th-val" id="th-char_hp">40%</span>
                            <button class="th-btn" onclick="th('char_hp', 5)">＋</button>
                        </div>
                    </div>
                    <div class="count-card">
                        <div class="cc-name">人物蓝条</div>
                        <div class="cc-ctrl">
                            <button class="th-btn" onclick="th('char_mp', -5)">−</button>
                            <span class="th-val" id="th-char_mp">40%</span>
                            <button class="th-btn" onclick="th('char_mp', 5)">＋</button>
                        </div>
                    </div>
                    <div class="count-card">
                        <div class="cc-name">召唤兽红条</div>
                        <div class="cc-ctrl">
                            <button class="th-btn" onclick="th('beast_hp', -5)">−</button>
                            <span class="th-val" id="th-beast_hp">40%</span>
                            <button class="th-btn" onclick="th('beast_hp', 5)">＋</button>
                        </div>
                    </div>
                    <div class="count-card">
                        <div class="cc-name">召唤兽蓝条</div>
                        <div class="cc-ctrl">
                            <button class="th-btn" onclick="th('beast_mp', -5)">−</button>
                            <span class="th-val" id="th-beast_mp">40%</span>
                            <button class="th-btn" onclick="th('beast_mp', 5)">＋</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 战斗动作分组：人物与召唤兽（单选，由 JS 动态生成） -->
            <div class="group-box">
                <div class="group-title">人物战斗动作</div>
                <div class="radio-grid battle-grid" id="battle-char-grid"></div>
            </div>
            <div class="group-box">
                <div class="group-title">召唤兽战斗动作</div>
                <div class="radio-grid battle-grid" id="battle-beast-grid"></div>
            </div>
        </div>
        <!-- 高级设置：调试信息（悬浮显示 + 右侧吸附日志窗口，切换后数秒生效） -->
        <div class="tab-panel" id="panel-advanced">
            <div class="group-box">
                <div class="group-title">调试信息</div>
                <label class="switch-row">
                    <input type="checkbox" id="debug-overlay">
                    <span class="switch-track"></span>
                    <span>游戏窗口悬浮显示任务信息（同时显示右侧吸附日志窗口）</span>
                </label>
            </div>
        </div>
    </div>

    <script>
        let running = false;
        let switching = false;  // 启停请求在途标记（防连点）
        const statusEl = document.getElementById('status');
        const btnStart = document.getElementById('btn-start');
        const btnTheme = document.getElementById('btn-theme');
        const modeRadios = document.querySelectorAll('input[name="task-mode"]');
        const useSyx = document.getElementById('use-syx');
        const debugOverlay = document.getElementById('debug-overlay');
        const xiuluoHezi = document.getElementById('xiuluo-hezi');
        const wubeiHezi = document.getElementById('wubei-hezi');

        // 战斗设置选项：人物 3 行 × 5 列技能 + 攻击/防御/捕捉/逃跑/无；召唤兽 5 技能 + 攻击/防御/逃跑/无
        const CHAR_BATTLE = [];
        for (let r = 1; r <= 3; r++) for (let c = 1; c <= 5; c++) CHAR_BATTLE.push('技能' + r + '-' + c);
        CHAR_BATTLE.push('攻击', '防御', '捕捉', '逃跑', '无');
        const BEAST_BATTLE = [];
        for (let i = 1; i <= 5; i++) BEAST_BATTLE.push('技能' + i);
        BEAST_BATTLE.push('攻击', '防御', '逃跑', '无');

        // 动态生成人物/召唤兽战斗动作单选网格，变更立即保存
        function buildBattleGrid(container, name, options) {
            options.forEach(opt => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'battle-' + name;
                input.value = opt;
                input.addEventListener('change', () => {
                    if (input.checked) callPython('save_battle_action', name, opt);
                });
                label.appendChild(input);
                label.appendChild(document.createTextNode(opt));
                container.appendChild(label);
            });
            return container;
        }
        const charBattleGrid = buildBattleGrid(document.getElementById('battle-char-grid'), 'char', CHAR_BATTLE);
        const beastBattleGrid = buildBattleGrid(document.getElementById('battle-beast-grid'), 'beast', BEAST_BATTLE);

        // 修罗设置：必须有的种族多选框（全部种族可选，变更立即保存）
        const XIULUO_RACES = ['男人', '女人', '男鬼', '女鬼', '男仙', '女仙', '男魔', '女魔', '男巫', '女巫', '男龙', '女龙'];
        const xiuluoRaceGrid = document.getElementById('xiuluo-race-grid');
        XIULUO_RACES.forEach(race => {
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.value = race;
            input.addEventListener('change', saveXiuluoRaces);
            label.appendChild(input);
            label.appendChild(document.createTextNode(race));
            xiuluoRaceGrid.appendChild(label);
        });

        // 修罗最少人数步进：±1，范围 3~5，变更立即保存
        async function xiuluoMin(delta) {
            const el = document.getElementById('xiuluo-min');
            const cur = parseInt(el.innerText);
            const val = Math.min(5, Math.max(3, cur + delta));
            if (val === cur) return;  // 已到上下限，不发请求
            const r = await callPython('save_xiuluo_min', val);
            if (r && r.status === 'success') el.innerText = r.min_members;
        }

        // 修罗必须有的种族变更：收集勾选项立即保存
        async function saveXiuluoRaces() {
            const checked = [...xiuluoRaceGrid.querySelectorAll('input:checked')].map(el => el.value);
            callPython('save_xiuluo_races', checked);
        }

        // 五倍最少人数步进：±1，范围 1~5，变更立即保存
        async function wubeiMin(delta) {
            const el = document.getElementById('wubei-min');
            const cur = parseInt(el.innerText);
            const val = Math.min(5, Math.max(1, cur + delta));
            if (val === cur) return;  // 已到上下限，不发请求
            const r = await callPython('save_wubei_min', val);
            if (r && r.status === 'success') el.innerText = r.min_members;
        }

        function update() {
            statusEl.innerText = running ? '运行中' : '已停止';
            statusEl.className = running ? 'running' : '';
            btnStart.innerText = running ? '停 止' : '启 动';
            btnStart.classList.toggle('running', running);
        }

        // 启动/停止切换：调用 Python 侧 TaskManager（防连点；Python 侧另有 BUSY 守卫）
        async function toggleTask() {
            if (switching) return;
            switching = true;
            btnStart.disabled = true;
            try {
                const r = await callPython(running ? 'stop_task' : 'start_task');
                if (r && r.status === 'success' && typeof r.running === 'boolean') {
                    running = r.running;  // 立即反馈；后续 syncStatus 再校正
                    update();
                }
            } finally {
                switching = false;
                btnStart.disabled = false;
            }
        }

        // 日志已移至独立吸附窗口（右侧），本页面仅保留调试开关的被动同步接口

        // 主题切换：按钮文案显示切换后的目标模式
        function applyTheme(theme) {
            document.body.classList.toggle('light', theme === 'light');
            btnTheme.innerText = theme === 'light' ? '深 色' : '浅 色';
        }
        async function toggleTheme() {
            const next = document.body.classList.contains('light') ? 'dark' : 'light';
            const r = await callPython('save_ui_theme', next);
            if (r && r.status === 'success') applyTheme(next);
        }

        // Tab 切换（默认选中任务设置）
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
                document.querySelectorAll('.tab-panel').forEach(p =>
                    p.classList.toggle('active', p.id === 'panel-' + tab.dataset.tab));
            });
        });

        // 页面初始化：恢复上次选择的主题、任务模式、摄妖香开关与各条阈值
        window.addEventListener('onPythonReady', async () => {
            try {
                const info = await callPython('get_init_data');
                if (info) {
                    applyTheme(info.theme === 'light' ? 'light' : 'dark');
                    if (info.mode) {
                        const radio = [...modeRadios].find(el => el.value === info.mode);
                        if (radio) radio.checked = true;
                    }
                    useSyx.checked = !!info.use_sheyaoxiang;
                    debugOverlay.checked = !!info.debug_overlay;
                    xiuluoHezi.checked = !!info.xiuluo_hezi;
                    wubeiHezi.checked = !!(info.wubei && info.wubei.hezi);
                    const ths = info.thresholds || {};
                    for (const key of ['char_hp', 'char_mp', 'beast_hp', 'beast_mp']) {
                        const el = document.getElementById('th-' + key);
                        if (el && ths[key] !== undefined) el.innerText = ths[key] + '%';
                    }
                    const counts = info.task_counts || {};
                    for (const mode of ['五环', '客栈', '修罗', '五倍', '玄枢轶闻', '名望']) {
                        const el = document.getElementById('cnt-' + mode);
                        if (el && counts[mode] !== undefined) el.innerText = counts[mode];
                    }
                    const battle = info.battle || {};
                    for (const [name, grid] of [['char', charBattleGrid], ['beast', beastBattleGrid]]) {
                        if (battle[name]) {
                            const radio = grid.querySelector('input[value="' + battle[name] + '"]');
                            if (radio) radio.checked = true;
                        }
                    }
                    const xl = info.xiuluo || {};
                    if (xl.min_members) {
                        document.getElementById('xiuluo-min').innerText = xl.min_members;
                    }
                    const wb = info.wubei || {};
                    if (wb.min_members) {
                        document.getElementById('wubei-min').innerText = wb.min_members;
                    }
                    if (xl.races) {
                        xiuluoRaceGrid.querySelectorAll('input').forEach(el => {
                            el.checked = xl.races.includes(el.value);
                        });
                    }
                }
            } catch (e) {}
        });

        // 阈值步进：±5%，范围 5~95，变更立即保存
        async function th(key, delta) {
            const el = document.getElementById('th-' + key);
            const cur = parseInt(el.innerText);
            const val = Math.min(95, Math.max(5, cur + delta));
            const r = await callPython('save_threshold', key, val);
            if (r && r.status === 'success') el.innerText = r.threshold + '%';
        }

        // 任务次数步进：±1，下限 0，部分模式有上限（五环2/客栈20/玄枢轶闻5/名望5），变更立即保存
        const COUNT_MAX = {'五环': 2, '客栈': 20, '玄枢轶闻': 5, '名望': 5};
        async function count(mode, delta) {
            const el = document.getElementById('cnt-' + mode);
            const cur = parseInt(el.innerText);
            const val = Math.min(COUNT_MAX[mode] || Infinity, Math.max(0, cur + delta));
            if (val === cur) return;  // 已到上下限，不发请求
            const r = await callPython('save_task_count', mode, val);
            if (r && r.status === 'success') el.innerText = r.count;
        }

        // 单选变更：立即保存选择
        modeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.checked) callPython('save_task_mode', radio.value);
            });
        });

        // 摄妖香开关变更：立即保存
        useSyx.addEventListener('change', () => {
            callPython('save_use_sheyaoxiang', useSyx.checked);
        });

        // 调试信息开关变更：立即保存（任务运行中切换后数秒生效）
        debugOverlay.addEventListener('change', () => {
            callPython('save_debug_overlay', debugOverlay.checked);
        });

        // 修罗自动抢盒子开关变更：立即保存（下次任务启动生效）
        xiuluoHezi.addEventListener('change', () => {
            callPython('save_xiuluo_hezi', xiuluoHezi.checked);
        });

        // 五倍自动抢盒子开关变更：立即保存（下次任务启动生效）
        wubeiHezi.addEventListener('change', () => {
            callPython('save_wubei_hezi', wubeiHezi.checked);
        });

        // Python 侧（任务状态联动）调用，用于同步页面显示
        window.syncStatus = function (isActive) {
            running = isActive;
            update();
        };

        // Python 侧调用：日志窗口被关闭时同步调试信息开关勾选（不触发保存回调）
        window.setDebugSwitch = function (on) {
            debugOverlay.checked = !!on;
        };

        async function reset() {
            const r = await callPython('reset_task');
            if (r && r.status === 'success') {
                running = false;
                if (r.mode) {
                    const radio = [...modeRadios].find(el => el.value === r.mode);
                    if (radio) radio.checked = true;
                }
                update();
            }
        }
    </script>
</body>
</html>
